[project]
name = "chat-bridge"
version = "0.1.0"
description = "A tool to migrate chat history between various AI agents."
readme = "README.md"
authors = [
    { name = "Brian Kroth", email = "bpkroth@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7",
    "pydantic>=2.7.1",
]

[project.scripts]
chat-bridge = "chat_bridge.cli:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pylint>=4.0.5",
    "pytest>=9.0.3",
    "ruff>=0.15.12",
    "ty>=0.0.35",
]

[tool.hatch.build.targets.wheel]
packages = ["src/chat_bridge"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # Pyflakes
    "I",    # isort (import sorting)
    "N",    # pep8-naming
    "UP",   # pyupgrade (modern Python syntax)
    "B",    # flake8-bugbear (potential bugs/design issues)
    "C4",   # flake8-comprehensions (better list/dict/set comprehensions)
    "SIM",  # flake8-simplify (code simplification)
    "PTH",  # flake8-use-pathlib (prefer pathlib over os.path)
    "ANN",  # flake8-annotations (enforce type annotations)
    "D",    # pydocstyle (enforce docstring conventions)
    "RUF",  # Ruff-specific rules
    "PL",   # Pylint parity rules
]

[tool.ruff.lint.extend-per-file-ignores]
"tests/*" = ["D", "ANN", "PLR2004"]  # Tests don't need strict docstrings or annotations
"src/chat_bridge/cli.py" = ["PLR0913"]  # CLI commands often have many arguments

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty]
# Configuration for ty
analysis = { "respect-type-ignore-comments" = true, "allowed-unresolved-imports" = [] }


[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pylint.messages_control]
disable = [
    "too-few-public-methods",       # Extractors and injectors usually only have one method
    "too-many-arguments",           # Bridge.run and CLI commands naturally have many params
    "too-many-positional-arguments", # Allow up to 6 positional params for run/migrate
]

[tool.pylint.format]
max-line-length = 88
