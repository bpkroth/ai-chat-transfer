name: Release

on:
  release:
    types: [ published ]

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/chat-bridge
    steps:
    - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    - name: Install uv
      run: curl -LsSf https://astral.sh/uv/install.sh | sh
    - name: Install dependencies
      run: make deps
    - name: Verify release tag matches project version
      run: |
        version="$(uv run python -c 'import pathlib, tomllib; print(tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"])')"
        test "${GITHUB_REF_NAME}" = "v${version}"
    - name: Run pre-commit run -a
      run: make check
    - name: Verify pre-commit did not change files
      run: git diff --exit-code
    - name: Run tests
      run: make test
    - name: Build package
      run: uv build
    - name: Check package distributions
      run: uvx twine check dist/*
    - name: Publish package distributions to PyPI
      uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
      with:
        password: ${{ secrets.PYPI_API_TOKEN }}
        print-hash: true
