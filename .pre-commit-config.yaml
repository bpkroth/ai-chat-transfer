repos:
- repo: local
  hooks:
    - id: ruff-check
      name: ruff check
      entry: uv run ruff check
      language: system
      types: [python]
    - id: ruff-format
      name: ruff format
      entry: uv run ruff format --check
      language: system
      types: [python]
    - id: pylint
      name: pylint
      entry: uv run pylint
      language: system
      types: [python]
    - id: ty-check
      name: ty check
      entry: uv run ty check
      language: system
      types: [python]
      pass_filenames: false
      always_run: true
